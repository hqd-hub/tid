<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Tid</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--text:#ece9e4;--muted:#949aa6;--accent:#f0b35a;--ink:#1a1307;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding-top:env(safe-area-inset-top);overscroll-behavior-y:none}
main{padding:16px 16px calc(160px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
h1{font-size:28px;margin:8px 0 2px;letter-spacing:-.01em}
h2{font-size:13px;margin:26px 0 8px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
h3{margin:0 0 6px;font-size:19px}
p{margin:6px 0}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.banner{border-color:rgba(240,179,90,.55);background:linear-gradient(rgba(240,179,90,.07),rgba(240,179,90,.07)),var(--card)}
.moment{display:flex;gap:12px;align-items:flex-start}
.emoji{font-size:26px;line-height:1.1;width:32px;text-align:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.presence i{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--accent);margin-left:3px;vertical-align:1px}
.presence i.on{background:var(--accent)}
.thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(15,17,21,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--accent)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--accent);color:var(--ink);border:0;border-radius:30px;padding:16px 22px;font-size:17px;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.45);z-index:11}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-height:48px;font-weight:600;width:100%;margin:6px 0;text-align:center}
.btn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.btn.ghost{background:none}
.btn.small{display:inline-block;width:auto;min-height:40px;padding:8px 14px;margin:0}
.btn:disabled{opacity:.35}
.row{display:flex;gap:8px;align-items:center}
.row>.grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:11px 16px;min-height:48px;font-size:16px}
.chip.on{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:600}
.pres{display:flex;gap:8px}
.pres button{flex:1;min-height:68px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:14px}
.pres button b{display:block;font-size:22px}
.pres button.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
input,textarea,select{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px}
input[type=color]{padding:2px;width:44px;height:44px;flex:none}
textarea{min-height:96px;resize:vertical}
.lbl{display:block;color:var(--muted);font-size:13px;margin:16px 0 8px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.hidden{display:none!important}
#sheetWrap{position:fixed;inset:0;z-index:20}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:10px 16px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
#modalWrap{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px}
#modal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:420px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(146px + env(safe-area-inset-bottom));z-index:50;background:#2d323d;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:600px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast button{background:none;border:0;color:var(--accent);font-weight:700;padding:4px}
#lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.pinDots{display:flex;gap:14px;margin:22px 0 10px;min-height:16px}
.pinDots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pinDots i.on{background:var(--accent);border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:16px;margin-top:14px}
.keypad button{width:76px;height:76px;border-radius:50%;border:0;background:var(--card2);font-size:28px}
.keypad button.blank{background:none;font-size:15px;color:var(--muted)}
.msg{min-height:22px;color:var(--accent);font-size:14px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:var(--card2);border-radius:12px;padding:10px 4px;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:22px;color:var(--text)}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;color:var(--muted)}
.daystrip div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 0;min-height:58px}
.daystrip div.today{border-color:var(--accent)}
.daystrip .dot{margin:2px}
.steps{display:flex;gap:4px;margin:4px 0 16px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.switch{position:relative;width:52px;height:32px;flex:none;display:inline-block}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:16px;transition:.2s}
.switch span:after{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:after{transform:translateX(20px)}
.listrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.listrow:last-child{border-bottom:0}
code{background:var(--card2);padding:2px 6px;border-radius:6px;font-size:13px;word-break:break-all}
ol.guide{padding-left:20px;margin:8px 0}
ol.guide li{margin:7px 0}
details summary{cursor:pointer;color:var(--accent);font-weight:600;padding:6px 0}
.weeknav{display:flex;align-items:center;justify-content:space-between}
.weeknav button{background:var(--card2);border:1px solid var(--line);border-radius:12px;width:48px;height:44px;font-size:20px}
.photoPrev{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:8px}
.quote{border-left:3px solid var(--accent);padding-left:10px;margin:8px 0;white-space:pre-wrap}
</style>
</head>

  <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Indstillinger</button>
</nav>
<div id="sheetWrap" class="hidden"><div class="backdrop" data-act="close-sheet"></div><div id="sheet"></div></div>
<div id="modalWrap" class="hidden"><div id="modal"></div></div>
<div id="toast" class="hidden"></div>

<input type="file" id="photoInput" accept="image/*" class="hidden">

<script>
'use strict';
const VERSION = '1.2.0';
const ITER = 310000;               // PBKDF2 iterations for the backup key
const BK_NAME = 'Tid-backup.tid';  // file name in Google Drive
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file'; // only files this app created

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

/* ---------------- IndexedDB ---------------- */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('tid', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      const keys = { people: 'id', categories: 'id', moments: 'id', reviews: 'isoWeek', photos: 'id', kv: 'k' };
      for (const [n, k] of Object.entries(keys)) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: k });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const store = (s, m = 'readonly') => db.transaction(s, m).objectStore(s);
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const all = s => rq(store(s).getAll());
const get = (s, k) => rq(store(s).get(k));
const put = (s, v) => rq(store(s, 'readwrite').put(v));
const del = (s, k) => rq(store(s, 'readwrite').delete(k));
const clear = s => rq(store(s, 'readwrite').clear());
const getKV = async k => (await get('kv', k))?.v;
const setKV = (k, v) => put('kv', { k, v });

/* ---------------- Bytes ---------------- */
function b64(buf) {
  const u = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
function unb64(s) {
  const bin = atob(s); const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}

/* ---------------- Dates ---------------- */
const pad = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ds(new Date());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ds(d); };
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ds(d); };
function isoWeek(s) {
  const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + 3); // Thursday of this week
  const y = d.getFullYear(); const j4 = new Date(y, 0, 4, 12);
  const w1 = new Date(j4); w1.setDate(j4.getDate() - ((j4.getDay() + 6) % 7) + 3);
  return `${y}-W${pad(1 + Math.round((d - w1) / 6048e5))}`;
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtDay = s => cap(parse(s).toLocaleDateString('da-DK', { weekday: 'long', day: 'numeric', month: 'long' }));
const fmtShort = s => parse(s).toLocaleDateString('da-DK', { day: 'numeric', month: 'short' });
const fmtTime = t => new Date(t).toLocaleString('da-DK', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const wkNum = wk => Number(wk.split('-W')[1]);

/* ---------------- Conversation library (append only: ids follow order) ----------------
   Partner starters: [depth, theme, text]  depth 1 = let, 2 = mellem, 3 = dyb
   Child starters:   [minAge, depth, text]  depth 1 = sjov, 2 = tænke (never heavy)
   Inspired by: Gottman (love maps, fondness & admiration, stress-reducing conversation, rituals & shared meaning,
   emotion coaching), Aron et al. 1997 (gradually deeper self-disclosure), Sue Johnson (A.R.E.), Esther Perel
   (curiosity, novelty) and research on open-ended questions with 3–6-year-olds. All questions are original. */
const THEMES = { kort: 'Kærlighedskort', beundring: 'Beundring', hverdag: 'Hverdag', drømme: 'Drømme', os: 'Os to', leg: 'Nysgerrighed', mening: 'Fælles mening', forældre: 'Forældre' };
const DEPTH = { partner: { 1: 'Let', 2: 'Mellem', 3: 'Dyb' }, child: { 1: 'Sjov', 2: 'Tænke' } };
const TIPS = {
  partner: {
    1: 'Bare hyg jer. Spørg videre med "hvorfor lige det?" – det er ofte dér, det bliver interessant.',
    2: 'Stil åbne spørgsmål og husk svarene. Gottman kalder det at holde sit "kærlighedskort" opdateret – par, der kender hinandens indre verden, står stærkere, når livet bliver travlt.',
    3: 'Vælg et roligt tidspunkt uden telefoner. Lyt for at forstå, ikke for at løse. Del selv noget bagefter – nærhed vokser, når åbenheden går begge veje.'
  },
  child: {
    1: 'Del gerne dit eget svar først – så er det lettere for barnet at byde ind.',
    2: 'Sæt ord på følelsen ("det lyder, som om du blev skuffet"). Ingen forhør – et kort svar er helt fint.',
    small: 'Til de mindste: hold det konkret og her-og-nu. Et valg mellem to ting virker godt.'
  }
};
const mkC = (list) => list.map(([age, depth, text], i) => ({ id: 'ks' + (i + 1), type: 'starter', for: 'child', age, depth, text }));
const mkP = (list) => list.map(([depth, theme, text], i) => ({ id: 'ps' + (i + 1), type: 'starter', for: 'partner', age: 0, depth, theme, text }));
const mkCh = (prefix, who) => (list) => list.map(([age, text], i) => ({ id: prefix + (i + 1), type: 'challenge', for: who, age, text }));
const IDEAS = [
  ...mkC([
    [3, 1, 'Hvad var det sjoveste, du lavede i dag?'], [3, 1, 'Hvem legede du med i dag?'], [3, 1, 'Hvis du var et dyr, hvilket dyr ville du så være?'],
    [3, 1, 'Hvad skal vi lave i weekenden, hvis du må bestemme?'], [3, 2, 'Hvad gjorde dig glad i dag?'], [3, 2, 'Var der noget, der var svært i dag?'],
    [3, 1, 'Hvad drømte du om i nat?'], [3, 1, 'Hvis du kunne flyve, hvor ville du så flyve hen?'], [3, 1, 'Hvad er din yndlingsfarve lige nu – og hvorfor?'],
    [3, 1, 'Hvis vi fik et kæledyr, hvad skulle det så hedde?'], [3, 2, 'Hvem var sød ved dig i dag?'], [3, 1, 'Hvad var dagens bedste mad?'],
    [3, 1, 'Hvis dit legetøj kunne tale, hvad ville det så sige om dig?'], [3, 1, 'Hvad skal vi synge, når vi putter i aften?'],
    [5, 2, 'Hvad var dagens højdepunkt – og dagens lavpunkt?'], [5, 1, 'Lærte du noget nyt i dag, som jeg ikke ved?'],
    [5, 1, 'Hvis du var lærer i en dag, hvad skulle klassen så lave?'], [5, 2, 'Hvad er du blevet bedre til i år?'],
    [5, 1, 'Hvis du kunne bytte plads med mig i en dag, hvad ville du så gøre?'], [5, 2, 'Hvad er det modigste, du nogensinde har gjort?'],
    [5, 2, 'Er der nogen i din klasse, der godt kunne bruge en ven?'], [5, 1, 'Hvis du kunne lave en ny regel derhjemme, hvad skulle den så være?'],
    [5, 1, 'Hvad tror du, jeg lavede på arbejdet i dag?'], [5, 1, 'Hvilken superkraft ville du gerne have – og hvad ville du bruge den til?'],
    [5, 2, 'Hvad gør du, når du bliver sur – og hvad hjælper dig?'], [5, 1, 'Hvis vi lavede en film om vores familie, hvad skulle den så hedde?'],
    [5, 1, 'Hvad er det sjoveste, vi nogensinde har lavet sammen?'], [5, 1, 'Hvad glæder du dig mest til lige nu?'],
    [5, 1, 'Hvad skulle der stå i en bog om dig?'], [5, 1, 'Hvis du fik 100 kroner, hvad ville du så gøre med dem?'],
    [5, 1, 'Hvem er den sjoveste i familien – og hvorfor?'], [5, 2, 'Hvad vil du gerne have, at vi to laver mere af?'],
    // 3+ sjov
    [3, 1, 'Hvad legede du med i børnehaven i dag?'], [3, 1, 'Hvad spiste du til frokost i dag?'], [3, 1, 'Vil du helst være en løve eller en fugl?'],
    [3, 1, 'Hvad skal din bamse lave i nat?'], [3, 1, 'Hvilken farve skulle vores hoveddør have, hvis du bestemte?'], [3, 1, 'Hvad tror du, en hund drømmer om?'],
    [3, 1, 'Hvis du var en lille mus, hvor ville du så bo i vores hus?'], [3, 1, 'Hvad er det sjoveste ved at være i bad?'],
    [3, 1, 'Hvilken lyd laver en dinosaur, når den er glad?'], [3, 1, 'Hvad skal vi bygge i weekenden?'], [3, 1, 'Hvem vil du gerne lege med i morgen?'],
    [3, 1, 'Hvad var det største, du så i dag?'], [3, 1, 'Vil du helst spise pandekager eller is hele ugen?'],
    [3, 1, 'Hvis du kunne tale med dyr, hvad ville du så spørge en elefant om?'], [3, 1, 'Hvad ligner den sky dér?'],
    [3, 1, 'Hvad var bedst i dag: morgenen, middagen eller aftenen?'], [3, 1, 'Hvilken sang synger I i børnehaven?'],
    [3, 1, 'Hvad skal vi lege, når vi kommer hjem?'], [3, 1, 'Hvis du var mor eller far i en dag, hvad skulle vi så have til aftensmad?'],
    [3, 1, 'Hvad er det sjoveste, man kan lave, når det regner?'],
    // 3+ tænke
    [3, 2, 'Hvad kan man gøre, når en ven er ked af det?'], [3, 2, 'Blev du lidt sur i dag? Hvad skete der?'], [3, 2, 'Hvad var du god til i dag?'],
    [3, 2, 'Hvem hjalp du i dag?'], [3, 2, 'Hvad gør dig tryg, når det er mørkt?'], [3, 2, 'Hvordan ser dit ansigt ud, når du er glad? Og når du er sur?'],
    [3, 2, 'Hvad er det bedste ved at have en søskende?'], [3, 2, 'Hvem savner du, når du er i børnehave?'],
    [3, 2, 'Hvad hjælper dig, når du er ked af det?'], [3, 2, 'Var der noget, du var lidt bange for i dag?'],
    // 5+ sjov
    [5, 1, 'Hvad legede I i frikvarteret?'], [5, 1, 'Hvad er det mærkeligste, du har set i denne uge?'],

const S = { tab: 'today', people: [], cats: [], moments: [], reviews: [], weekOffset: 0, unlocked: false, pending: [], backupPending: false, keyMem: null,
  ideas: { fav: [], used: {}, custom: [], week: {} }, snakPerson: null, snakCur: {}, snakDepth: { partner: 0, child: 0 } };
const person = id => S.people.find(p => p.id === id);
const catOf = id => S.cats.find(c => c.id === id);
const reviewOf = wk => S.reviews.find(r => r.isoWeek === wk);
const isCouple = m => m.category === 'kaerestetid' || (m.people.length === 1 && person(m.people[0])?.kind === 'partner');
const activePeople = () => S.people.filter(p => p.active);
const children = () => activePeople().filter(p => p.kind === 'child');
const partner = () => activePeople().find(p => p.kind === 'partner');

async function loadAll() {
  S.people = (await all('people')).sort((a, b) => a.order - b.order);
  S.cats = (await all('categories')).sort((a, b) => a.order - b.order);
  S.moments = (await all('moments')).sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  S.reviews = (await all('reviews')).sort((a, b) => b.isoWeek.localeCompare(a.isoWeek));
  S.ideas = Object.assign({ fav: [], used: {}, custom: [], week: {} }, (await getKV('ideas')) || {});
}
const saveIdeas = () => setKV('ideas', S.ideas);

/* ---------------- Idea logic ---------------- */
const allIdeas = () => [...IDEAS, ...S.ideas.custom];
const ideaOf = id => allIdeas().find(i => i.id === id);
const ageOf = p => p.birthYear ? new Date().getFullYear() - p.birthYear : null;
function fits(i, p) {
  if (i.for !== (p.kind === 'partner' ? 'partner' : 'child')) return false;
  const age = ageOf(p);
  return !(p.kind === 'child' && age !== null && (i.age || 0) > age);
}
const kindOf = p => p.kind === 'partner' ? 'partner' : 'child';
const pool = (p, type, depth) => allIdeas().filter(i => i.type === type && fits(i, p) && (!depth || !i.depth || i.depth === depth));
const depthPref = p => S.snakDepth[kindOf(p)] || 0;
function pickIdea(p, type, excludeId) {
  const c = pool(p, type, type === 'starter' ? depthPref(p) : 0).filter(i => i.id !== excludeId);
  const cutoff = Date.now() - 60 * 864e5;
  const fresh = c.filter(i => !(S.ideas.used[i.id] > cutoff));
  const arr = fresh.length ? fresh : c;
  return arr[Math.floor(Math.random() * arr.length)] || null;
}
// Partner rhythm: lighter on busy weekdays, deeper at the weekend (Sun = dyb, Fri/Sat = mellem, Tue/Thu = mellem, else let)
const weekdayDepth = () => ({ 0: 3, 1: 1, 2: 2, 3: 1, 4: 2, 5: 2, 6: 2 })[new Date().getDay()];
function dailyPick(p, type) {
  const d = type === 'starter' ? (depthPref(p) || (kindOf(p) === 'partner' ? weekdayDepth() : 0)) : 0;
  const base = pool(p, type, d).length ? pool(p, type, d) : pool(p, type);
  const arr = base.filter(i => !(S.ideas.used[i.id] > Date.now() - 60 * 864e5));
  const list = arr.length ? arr : base;
  if (!list.length) return null;
  let h = 0; for (const c of today() + p.id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return list[h % list.length];
}
function currentStarter(p) {
  const id = S.snakCur[p.id];
  return (id && ideaOf(id)) || dailyPick(p, 'starter');
}
async function weekChallenge(p, wk = isoWeek(today()), create = true) {
  const w = S.ideas.week[wk] || (S.ideas.week[wk] = {});
  if ((!w[p.id] || !ideaOf(w[p.id].id)) && create) {
    const i = pickIdea(p, 'challenge'); if (!i) return null;
    w[p.id] = { id: i.id, done: false }; await saveIdeas();
  }
  return w[p.id] || null;
}

async function seed() {
  const cats = [
    ['leg', '🧩', 'Leg'], ['godnat', '🌙', 'Godnat'], ['udflugt', '🌳', 'Udflugt'], ['snak', '💬', 'Snak'],
    ['hjalp', '🤝', 'Hjalp med noget'], ['maaltid', '🍽️', 'Måltid'], ['aktivitet', '⚽', 'Aktivitet'], ['kaerestetid', '❤️', 'Kærestetid']
  ];
  for (const [i, [id, emoji, label]] of cats.entries()) await put('categories', { id, emoji, label, active: true, order: i, partnerOnly: id === 'kaerestetid' });
  await setKV('seeded', true);
}

// Names are entered on first launch so no personal data lives in the app's code
async function askPeople() {
  const v = await modal({ title: 'Hvem er det for?', text: 'Navnene gemmes kun på din telefon. Du kan tilføje og ændre dem under Indstillinger.',
    fields: [{ name: 'c1', placeholder: 'Barn 1' }, { name: 'c2', placeholder: 'Barn 2' }, { name: 'p', placeholder: 'Partner' }], ok: 'Gem', cancel: '' });
  const list = [[v?.c1, 'child', '#7aa2f7'], [v?.c2, 'child', '#e0af68'], [v?.p, 'partner', '#c49bf5']].filter(x => x[0] && x[0].trim());
  for (const [i, [name, kind, color]] of list.entries()) await put('people', { id: uid(), name: name.trim(), kind, color, active: true, order: i });
  await loadAll();
}

/* ---------------- UI helpers ---------------- */
let toastT;
function toast(msg, actLabel, act) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${actLabel ? `<button>${esc(actLabel)}</button>` : ''}`;
  t.classList.remove('hidden');
  if (actLabel) t.querySelector('button').onclick = () => { t.classList.add('hidden'); act(); };
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.add('hidden'), actLabel ? 6000 : 2600);
}
function modal({ title, text = '', html = '', fields = [], ok = 'OK', cancel = 'Annullér' }) {
  return new Promise(res => {
    const m = $('#modal');
    m.innerHTML = `<h3>${esc(title)}</h3>${text ? `<p class="sub">${esc(text)}</p>` : ''}${html}
      ${fields.map(f => `<input name="${f.name}" type="${f.type || 'text'}" placeholder="${esc(f.placeholder || '')}" value="${esc(f.value || '')}" style="margin:6px 0" autocomplete="off" autocapitalize="off">`).join('')}
      <div class="row" style="margin-top:12px">${cancel ? `<button class="btn ghost" data-m="0">${esc(cancel)}</button>` : ''}<button class="btn primary" data-m="1">${esc(ok)}</button></div>`;
    $('#modalWrap').classList.remove('hidden');
    const first = m.querySelector('input'); if (first) setTimeout(() => first.focus(), 60);
    m.onclick = e => {
      const b = e.target.closest('[data-m]'); if (!b) return;
      const vals = {}; m.querySelectorAll('input').forEach(i => vals[i.name] = i.value);
      $('#modalWrap').classList.add('hidden'); m.onclick = null;
      res(b.dataset.m === '1' ? vals : null);
    };
  });
}
const confirmBox = (title, text, ok = 'Fortsæt') => modal({ title, text, ok }).then(v => !!v);
function openSheet(html) { $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheetWrap').classList.remove('hidden'); hydratePhotos($('#sheet')); }
function closeSheet() { $('#sheetWrap').classList.add('hidden'); $('#sheet').innerHTML = ''; C = null; R = null; }

const photoURLs = new Map();
async function photoURL(id) {
  if (photoURLs.has(id)) return photoURLs.get(id);
  const p = await get('photos', id); if (!p) return '';
  const u = URL.createObjectURL(new Blob([p.buf], { type: p.type || 'image/jpeg' }));
  photoURLs.set(id, u); return u;
}
function hydratePhotos(root) { root.querySelectorAll('img[data-photo]').forEach(async img => { img.src = await photoURL(img.dataset.photo); }); }

const presDots = n => `<span class="presence">${[1, 2, 3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;
const PRES = { 1: 'Halvt', 2: 'Til stede', 3: 'Helt' };
function momentCard(m) {
  const c = catOf(m.category) || { emoji: '•', label: '–' };
  const ps = m.people.map(person).filter(Boolean);
  return `<div class="card moment" data-act="edit" data-id="${m.id}">
    <div class="emoji">${esc(c.emoji)}</div>
    <div style="flex:1;min-width:0">
      <div><b>${esc(c.label)}</b> ${presDots(m.presence)}</div>
      <div class="sub">${ps.map(p => `<span class="dot" style="background:${esc(p.color)}"></span>${esc(p.name)}`).join(' &nbsp;')}</div>
      ${m.note ? `<div style="margin-top:6px">${esc(m.note)}</div>` : ''}
    </div>
    ${m.photoId ? `<img class="thumb" data-photo="${m.photoId}" alt="">` : ''}
  </div>`;
}
const banner = (title, text, act, extra = '') => `<div class="card banner" data-act="${act}" ${extra}><b>${esc(title)}</b>${text ? `<div class="sub">${esc(text)}</div>` : ''}</div>`;

async function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  $('#fab').classList.toggle('hidden', S.tab === 'settings' || S.tab === 'snak' || !S.unlocked);
  const v = $('#view');
  v.innerHTML = S.tab === 'today' ? await viewToday() : S.tab === 'week' ? viewWeek() : S.tab === 'snak' ? await viewSnak() : await viewSettings();
  hydratePhotos(v);
}

async function viewToday() {
  const t = today(); const now = new Date(); const wk = isoWeek(t);
  const todays = S.moments.filter(m => m.date === t);
  let h = `<h1>${fmtDay(t)}</h1><div class="sub">${todays.length ? `${todays.length} ${todays.length === 1 ? 'øjeblik' : 'øjeblikke'} i dag` : 'Uge ' + wkNum(wk)}</div>`;

  if (!(await backupKey())) h += banner('Opsæt backup', 'Vælg et backup-kodeord og forbind Google Drive, så dine øjeblikke er sikret.', 'go-backup');
  else if (S.backupPending) h += banner('Backup venter', 'Tryk for at tage backup til Google Drive.', 'drive-backup');
  if (now.getDay() === 0 && now.getHours() >= 16 && !reviewOf(wk)) h += banner('Søndagsrefleksion', 'Fem minutter med ugen, før I planlægger den næste.', 'review', `data-wk="${wk}"`);
  if (now.getHours() >= 19 && !todays.length) h += banner('Noget værd at gemme fra i dag?', 'Et lille øjeblik er nok.', 'capture');

  const intention = reviewOf(isoWeek(addDays(t, -7)))?.intention;
  if (intention) h += `<div class="card"><div class="sub">Ugens intention</div><div class="quote">${esc(intention)}</div></div>`;

  const ap = activePeople();
  if (ap.length) {
    const qs = ap.map(p => [p, dailyPick(p, 'starter')]).filter(x => x[1]);
    let done = 0, tot = 0;
    for (const p of ap) { const w = S.ideas.week[wk]?.[p.id]; if (w) { tot++; if (w.done) done++; } }
    h += `<div class="card" data-act="tab" data-tab="snak"><div class="sub">Dagens samtalestartere</div>
      ${qs.map(([p, i]) => `<p><span class="dot" style="background:${esc(p.color)}"></span><b>${esc(p.name)}:</b> ${esc(i.text)}</p>`).join('')}
      <div class="sub" style="margin-top:6px">${tot ? `Ugens udfordringer: ${done} af ${tot} gennemført` : 'Se ugens udfordringer under Snak'} ›</div></div>`;
  }

  h += `<h2>I dag</h2>` + (todays.length ? todays.map(momentCard).join('') : `<p class="sub">Ingen øjeblikke endnu i dag.</p>`);

  const earlier = S.moments.filter(m => m.date < t && m.date >= addDays(t, -14));
  let last = '';
  for (const m of earlier) {
    if (m.date !== last) { h += `<h2>${fmtDay(m.date)}</h2>`; last = m.date; }
    h += momentCard(m);
  }
  return h;
}

function viewWeek() {
  const base = addDays(mondayOf(today()), S.weekOffset * 7);
  const days = [...Array(7)].map((_, i) => addDays(base, i));
  const wk = isoWeek(base);
  const ms = S.moments.filter(m => m.date >= days[0] && m.date <= days[6]);
  const avg = ms.length ? (ms.reduce((a, m) => a + m.presence, 0) / ms.length).toFixed(1).replace('.', ',') : '–';
  const couple = ms.filter(isCouple).length;

  let h = `<div class="weeknav"><button data-act="week-prev">‹</button>
    <div style="text-align:center"><h1 style="margin:0">Uge ${wkNum(wk)}</h1><div class="sub">${fmtShort(days[0])} – ${fmtShort(days[6])}</div></div>
    <button data-act="week-next" ${S.weekOffset >= 0 ? 'disabled style="opacity:.3"' : ''}>›</button></div>`;

  const intention = reviewOf(isoWeek(addDays(base, -7)))?.intention;
  if (intention) h += `<div class="card"><div class="sub">Intention for ugen</div><div class="quote">${esc(intention)}</div></div>`;

  h += `<div class="card stat"><div><b>${ms.length}</b>øjeblikke</div><div><b>${avg}</b>nærvær</div><div><b>${couple}</b>kærestetid</div></div>`;

  const letters = ['M', 'T', 'O', 'T', 'F', 'L', 'S'];
  h += `<div class="daystrip">${days.map((d, i) => {
    const ids = [...new Set(ms.filter(m => m.date === d).flatMap(m => m.people))];
    return `<div class="${d === today() ? 'today' : ''}">${letters[i]}<br>${ids.map(id => person(id) ? `<span class="dot" style="background:${esc(person(id).color)}"></span>` : '').join('')}</div>`;
  }).join('')}</div>`;

  h += `<h2>Personer</h2>`;
  for (const p of activePeople()) {
    const pm = ms.filter(m => m.people.includes(p.id));
    const solo = pm.filter(m => m.people.length === 1).length;
    const pa = pm.length ? (pm.reduce((a, m) => a + m.presence, 0) / pm.length).toFixed(1).replace('.', ',') : '–';
    h += `<div class="card"><div class="row"><span class="dot" style="background:${esc(p.color)}"></span><b class="grow">${esc(p.name)}</b><span class="sub">nærvær ${pa}</span></div>
      <div class="sub" style="margin-top:4px">${pm.length} ${pm.length === 1 ? 'øjeblik' : 'øjeblikke'} · ${p.kind === 'partner' ? 'kun jer to' : 'alene med dig'}: ${solo}</div></div>`;
  }

  const wch = S.ideas.week[wk] || {};
  const chs = activePeople().filter(p => wch[p.id] && ideaOf(wch[p.id].id));
  if (chs.length) {
    h += `<h2>Ugens udfordringer</h2><div class="card">` + chs.map(p => `<div class="listrow"><span class="dot" style="background:${esc(p.color)}"></span>
      <div class="grow"><b>${esc(p.name)}</b><div class="sub">${esc(ideaOf(wch[p.id].id).text)}</div></div><span class="sub">${wch[p.id].done ? '✓ gjort' : 'åben'}</span></div>`).join('') + `</div>`;
  }

  const rv = reviewOf(wk);
  h += `<h2>Refleksion</h2>`;
  if (rv) {
    h += `<div class="card" data-act="review" data-wk="${wk}"><b>Ugens refleksion er skrevet</b>
      ${rv.intention ? `<div class="sub" style="margin-top:4px">Intention for næste uge: ${esc(rv.intention)}</div>` : ''}
      <div class="sub" style="margin-top:4px">Tryk for at læse eller redigere</div></div>`;
  } else {
    h += `<button class="btn primary" data-act="review" data-wk="${wk}">Start søndagsrefleksion</button>`;
  }

  const past = S.reviews.filter(r => r.isoWeek !== wk).slice(0, 12);
  if (past.length) {
    h += `<h2>Tidligere refleksioner</h2>`;
    h += past.map(r => `<div class="card" data-act="review" data-wk="${r.isoWeek}"><b>Uge ${wkNum(r.isoWeek)}</b>${r.intention ? ` <span class="sub">· ${esc(r.intention)}</span>` : ''}</div>`).join('');
  }
  return h;
}

async function viewSnak() {
  const ap = activePeople();
  if (!ap.length) return `<h1>Snak</h1><p class="sub">Tilføj personer under Indstillinger først.</p>`;
  if (!ap.find(p => p.id === S.snakPerson)) S.snakPerson = ap[0].id;
  const p = person(S.snakPerson);
  const st = currentStarter(p);
  const ch = await weekChallenge(p);
  const chI = ch && ideaOf(ch.id);
  const isFav = id => S.ideas.fav.includes(id);
  const favs = S.ideas.fav.map(ideaOf).filter(i => i && i.type === 'starter' && fits(i, p));
  const customs = S.ideas.custom.filter(i => i.for === (p.kind === 'partner' ? 'partner' : 'child'));
  const age = ageOf(p);

  let h = `<h1>Snak</h1><div class="sub">Samtalestartere og små udfordringer</div>
    <div class="chips" style="margin:14px 0 4px">${ap.map(x => `<button class="chip ${x.id === p.id ? 'on' : ''}" data-act="snak-person" data-id="${x.id}"><span class="dot" style="background:${esc(x.color)}"></span>${esc(x.name)}</button>`).join('')}</div>
    ${p.kind === 'child' && age === null ? `<p class="sub">Tip: angiv fødselsår under Indstillinger, så spørgsmålene passer til alderen.</p>` : ''}`;

  const kd = kindOf(p); const dsel = S.snakDepth[kd] || 0;
  const tip = st ? (kd === 'child' && age !== null && age < 5 && st.depth !== 2 ? TIPS.child.small : TIPS[kd][st.depth || 1]) : '';
  const meta = st ? [st.depth ? DEPTH[kd][st.depth] : '', st.theme ? THEMES[st.theme] : '', st.id.startsWith('c') ? 'Egen' : ''].filter(Boolean).join(' · ') : '';
  h += `<h2>Samtalestarter</h2>
    <div class="chips" style="margin-bottom:8px">${[[0, 'Alle'], ...Object.entries(DEPTH[kd]).map(([k, v]) => [Number(k), v])].map(([k, v]) =>
      `<button class="chip ${dsel === k ? 'on' : ''}" style="min-height:40px;padding:8px 14px;font-size:15px" data-act="snak-depth" data-d="${k}">${v}</button>`).join('')}</div>`;
  h += st ? `<div class="card">${meta ? `<div class="sub" style="text-transform:uppercase;letter-spacing:.05em;font-size:12px;font-weight:700">${esc(meta)}</div>` : ''}
      <div style="font-size:21px;line-height:1.35;font-weight:600;margin:4px 0 12px">${esc(st.text)}</div>
      <div class="row"><button class="btn small" data-act="snak-new">↻ Ny</button>
      <button class="btn small" data-act="snak-fav" data-idea="${st.id}">${isFav(st.id) ? '★ Favorit' : '☆ Gem'}</button>
      <button class="btn small primary grow" data-act="snak-used" data-idea="${st.id}">Brugt – gem øjeblik</button></div>
      ${tip ? `<p class="sub" style="margin-top:12px">💡 ${esc(tip)}</p>` : ''}</div>`
    : `<p class="sub">Ingen spørgsmål passer endnu.</p>`;

  h += `<h2>Ugens udfordring</h2>`;
  h += chI ? `<div class="card ${ch.done ? '' : 'banner'}"><div style="font-size:18px;font-weight:600;margin:2px 0 12px">${esc(chI.text)}</div>
      ${ch.done ? `<div class="sub">✓ Gennemført i denne uge</div>`
        : `<div class="row"><button class="btn small" data-act="ch-new">↻ En anden</button><button class="btn small primary grow" data-act="ch-done">Gennemført – gem øjeblik</button></div>`}</div>`
    : `<p class="sub">Ingen udfordringer passer endnu.</p>`;

  if (favs.length) h += `<h2>Favoritter</h2><div class="card">${favs.map(i => `<div class="listrow" data-act="snak-show" data-idea="${i.id}"><div class="grow">${esc(i.text)}</div><span class="sub">›</span></div>`).join('')}</div>`;

  h += `<h2>Egne idéer til ${p.kind === 'partner' ? esc(p.name) : 'børnene'}</h2><div class="card">
    ${customs.map(i => `<div class="listrow"><div class="grow">${esc(i.text)}<div class="sub">${i.type === 'starter' ? 'Spørgsmål' : 'Udfordring'}</div></div><button class="btn small ghost" data-act="del-custom" data-idea="${i.id}">Slet</button></div>`).join('') || '<p class="sub">Ingen endnu.</p>'}
    <div class="row" style="margin-top:8px"><button class="btn small grow" data-act="add-custom" data-type="starter">+ Spørgsmål</button><button class="btn small grow" data-act="add-custom" data-type="challenge">+ Udfordring</button></div></div>`;

  h += `<h2>Om spørgsmålene</h2><div class="card"><details><summary>Hvor kommer de fra?</summary>
    <p class="sub">Alle spørgsmål er skrevet til Tid, men bygger på ideer fra parforholds- og børnepsykologien:</p>
    <ul class="sub" style="padding-left:18px;margin:6px 0">
      <li><b>John & Julie Gottman:</b> "kærlighedskort" (at kende hinandens indre verden), beundring, den daglige snak om stress uden for forholdet, og fælles ritualer og mening.</li>
      <li><b>Arthur Aron:</b> nærhed vokser, når man gradvist åbner sig mere – derfor Let, Mellem og Dyb.</li>
      <li><b>Sue Johnson:</b> det store spørgsmål under det hele: "Er du der for mig?"</li>
      <li><b>Esther Perel:</b> nysgerrighed og nyhed – at se den anden med friske øjne.</li>
      <li><b>Til børnene:</b> åbne spørgsmål frem for ja/nej, konkret og her-og-nu for de mindste, og Gottmans følelsescoaching: at hjælpe barnet med at sætte ord på følelser.</li>
    </ul>
    <p class="sub">Rytme: hverdagens spørgsmål til ${esc(partner()?.name || 'din partner')} er lettere, og søndag er de dybere. Vælg selv niveau ovenfor.</p></details></div>`;
  return h;
}

async function compress(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.7));
  } finally { URL.revokeObjectURL(url); }
}

/* ---------------- Lock (PIN + Face ID) ---------------- */
async function hashPin(pin, salt) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  return b64(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' }, k, 256));
}
async function faceAvailable() {
  try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch { return false; }
}
async function enableFace() {
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name: 'Tid' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'tid', displayName: 'Tid' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      timeout: 60000 } });
    await setKV('faceId', b64(cred.rawId)); toast('Face ID slået til'); return true;
  } catch (e) { toast('Face ID blev ikke slået til'); return false; }
}
async function faceUnlock() {
  const id = await getKV('faceId'); if (!id) return;
  try {
    await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: unb64(id) }], userVerification: 'required', timeout: 60000 } });
    unlocked();
  } catch { L.msg = 'Face ID mislykkedes – brug koden'; renderLock(); }
}
const L = { mode: 'unlock', entry: '', first: '', msg: '', fails: 0, until: 0 };
function showLock(mode) {
  Object.assign(L, { mode, entry: '', first: '', msg: '' });
  if (mode === 'unlock') { S.unlocked = false; closeSheet(); $('#modalWrap').classList.add('hidden'); $('#fab').classList.add('hidden'); }
  $('#lock').classList.remove('hidden'); renderLock();
}
async function renderLock() {
  const pin = await getKV('pin'); const face = await getKV('faceId');
  const t = { unlock: ['Tid', 'Indtast din kode'], setup1: ['Vælg en kode', '4–6 cifre. Bruges hver gang du åbner appen.'], setup2: ['Gentag koden', 'Indtast den samme kode igen'] }[L.mode];
  const n = L.mode === 'unlock' ? pin.len : L.mode === 'setup2' ? L.first.length : Math.max(4, L.entry.length);
  const leftKey = L.mode === 'unlock' && face ? `<button class="blank" data-k="face">Face ID</button>`
    : L.mode === 'setup1' ? `<button class="blank" data-k="next" ${L.entry.length < 4 ? 'style="opacity:.3"' : ''}>Videre</button>` : `<button class="blank" disabled></button>`;
  $('#lock').innerHTML = `<h1>${t[0]}</h1><div class="sub">${t[1]}</div>
    <div class="pinDots">${[...Array(n)].map((_, i) => `<i class="${i < L.entry.length ? 'on' : ''}"></i>`).join('')}</div>
    <div class="msg">${esc(L.msg)}</div>
    <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button data-k="${d}">${d}</button>`).join('')}${leftKey}<button data-k="0">0</button><button class="blank" data-k="del">⌫</button></div>
    ${L.mode !== 'unlock' && S.unlocked ? `<button class="btn ghost" style="max-width:260px;margin-top:20px" data-k="cancel">Annullér</button>` : ''}`;
}
async function lockKey(k) {
  if (k === 'cancel') { $('#lock').classList.add('hidden'); return; }
  if (k === 'face') return faceUnlock();
  if (L.mode === 'unlock' && Date.now() < L.until) { L.msg = 'Vent lidt…'; return renderLock(); }
  if (k === 'del') { L.entry = L.entry.slice(0, -1); return renderLock(); }
  if (k === 'next') { if (L.entry.length >= 4) Object.assign(L, { first: L.entry, entry: '', mode: 'setup2', msg: '' }); return renderLock(); }
  if (L.entry.length >= 6) return;
  L.entry += k; L.msg = '';
  if (L.mode === 'unlock') {
    const pin = await getKV('pin');
    if (L.entry.length === pin.len) {
      if (await hashPin(L.entry, unb64(pin.salt)) === pin.hash) { L.fails = 0; return unlocked(); }
      L.entry = ''; L.fails++; L.msg = 'Forkert kode';
      if (L.fails >= 5) { L.fails = 0; L.until = Date.now() + 30000; L.msg = 'For mange forsøg – vent 30 sekunder'; }
    }
  } else if (L.mode === 'setup1' && L.entry.length === 6) {
    Object.assign(L, { first: L.entry, entry: '', mode: 'setup2' });
  } else if (L.mode === 'setup2' && L.entry.length === L.first.length) {
    if (L.entry === L.first) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      await setKV('pin', { salt: b64(salt), hash: await hashPin(L.entry, salt), len: L.entry.length });
      if (S.unlocked) { $('#lock').classList.add('hidden'); toast('Kode ændret'); return; }
      $('#lock').classList.add('hidden');
      if (await faceAvailable() && await confirmBox('Brug Face ID?', 'Så kan du låse Tid op med Face ID. Koden virker stadig som reserve.', 'Slå til')) await enableFace();
      if (!S.people.length) await askPeople();
      return unlocked();
    }
    Object.assign(L, { entry: '', first: '', mode: 'setup1', msg: 'Koderne var ikke ens – prøv igen' });
  }
  renderLock();
}
async function unlocked() {
  S.unlocked = true; $('#lock').classList.add('hidden');
  await render();
  const p = S.pending.splice(0); for (const f of p) await f();

/* ---------------- Encryption ---------------- */
async function deriveKey(pass, salt) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function backupKey() { if (S.keyMem) return S.keyMem; try { return await getKV('bkKey'); } catch { return null; } }
async function storeKey(key, salt) {
  S.keyMem = key;
  await setKV('bkSalt', b64(salt));
  try { await setKV('bkKey', key); } catch { /* browser can't persist CryptoKey: keep in memory for this session */ }
}
async function setPassphrase() {
  const v = await modal({ title: 'Backup-kodeord', text: 'Krypterer din backup. Det gemmes ikke i klartekst og kan ikke genskabes – gem det i din adgangskodeadministrator.',
    fields: [{ name: 'p1', type: 'password', placeholder: 'Kodeord (mindst 10 tegn)' }, { name: 'p2', type: 'password', placeholder: 'Gentag kodeord' }], ok: 'Gem' });
  if (!v) return;
  if (v.p1.length < 10) return toast('Kodeordet skal være mindst 10 tegn');
  if (v.p1 !== v.p2) return toast('Kodeordene var ikke ens');
  const salt = crypto.getRandomValues(new Uint8Array(16));
  await storeKey(await deriveKey(v.p1, salt), salt);
  toast('Backup-kodeord gemt'); await render();
  if (await getKV('driveClientId')) driveBackup(false);
}
async function snapshot() {
  const photos = await all('photos');
  return { app: 'tid', v: 1, exportedAt: new Date().toISOString(), people: S.people, categories: S.cats, moments: S.moments, reviews: S.reviews, ideas: S.ideas,
    photos: photos.map(p => ({ id: p.id, type: p.type, b64: b64(p.buf) })) };
}
async function encryptSnapshot(key) {
  const salt = await getKV('bkSalt');
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(await snapshot())));
  return JSON.stringify({ app: 'tid', v: 1, kdf: 'PBKDF2-SHA256', iter: ITER, salt, iv: b64(iv), ct: b64(ct) });
}
async function decryptBackup(text) {
  let env; try { env = JSON.parse(text); } catch { throw new Error('Filen er ikke en Tid-backup'); }
  if (env.app !== 'tid' || !env.ct) throw new Error('Filen er ikke en Tid-backup');
  const v = await modal({ title: 'Backup-kodeord', text: 'Indtast kodeordet, backuppen blev krypteret med.', fields: [{ name: 'p', type: 'password', placeholder: 'Kodeord' }], ok: 'Lås op' });
  if (!v) return null;
  const salt = unb64(env.salt);
  const key = await deriveKey(v.p, salt);
  let pt;
  try { pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.ct)); }
  catch { throw new Error('Forkert kodeord eller beskadiget fil'); }

}
async function restoreFrom(res) {
  if (!res) return;
  const { obj, key, salt } = res;

  if (!await confirmBox('Gendan backup?', `Backuppen fra ${fmtTime(obj.exportedAt)} indeholder ${n} øjeblikke. Den erstatter alt på denne telefon.`, 'Gendan')) return;
  for (const s of ['people', 'categories', 'moments', 'reviews', 'photos']) await clear(s);

  for (const m of obj.moments || []) await put('moments', m);
  for (const r of obj.reviews || []) await put('reviews', r);
  for (const p of obj.photos || []) await put('photos', { id: p.id, type: p.type, buf: unb64(p.b64).buffer });
  if (obj.ideas) await setKV('ideas', obj.ideas);
  photoURLs.clear();
  await storeKey(key, salt);
  await loadAll(); await render(); toast('Backup gendannet');
}

const redirectUri = () => location.origin + location.pathname;
async function driveConnect(after) {
  const cid = await getKV('driveClientId');
  if (!cid) { toast('Indsæt først dit Google Client ID under Indstillinger'); S.tab = 'settings'; return render(); }
  const state = uid();
  localStorage.setItem('tid_oauth_state', state);
  localStorage.setItem('tid_oauth_after', after || '');
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + new URLSearchParams({
    client_id: cid, redirect_uri: redirectUri(), response_type: 'token', scope: DRIVE_SCOPE, include_granted_scopes: 'true', state });
}

  if (!st || h.get('state') !== st) return S.pending.push(() => toast('Google-login afvist (sikkerhedstjek fejlede)'));
  await setKV('driveToken', { t: h.get('access_token'), exp: Date.now() + (Number(h.get('expires_in') || 3600) - 60) * 1000 });
  if (after === 'backup') S.pending.push(() => driveBackup(false));
  else if (after === 'restore') S.pending.push(() => driveRestore());
  else S.pending.push(() => toast('Google Drive forbundet'));
}
async function driveToken() { const t = await getKV('driveToken'); return t && t.exp > Date.now() ? t.t : null; }
const authErr = () => Object.assign(new Error('auth'), { auth: true });
async function gfetch(url, opt = {}) {
  const t = await driveToken(); if (!t) throw authErr();
  const r = await fetch(url, { ...opt, headers: { ...(opt.headers || {}), Authorization: 'Bearer ' + t } });
  if (r.status === 401) { await setKV('driveToken', null); throw authErr(); }
  return r;
}
async function driveFindId() {
  let id = await getKV('driveFileId'); if (id) return id;
  const q = encodeURIComponent(`name='${BK_NAME}' and trashed=false`);
  const r = await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime%20desc&fields=files(id,modifiedTime)&spaces=drive`);
  if (!r.ok) throw new Error('Drive ' + r.status);
  id = (await r.json()).files?.[0]?.id || null;
  if (id) await setKV('driveFileId', id);
  return id;
}
let backupBusy = false;
async function driveBackup(silent) {
  if (backupBusy) return; backupBusy = true;
  try {
    const key = await backupKey();
    if (!key) { if (!silent) { toast('Vælg først et backup-kodeord'); setPassphrase(); } return; }
    if (!await getKV('driveClientId')) { if (!silent) driveConnect('backup'); return; }
    if (!await driveToken()) { if (silent) { S.backupPending = true; render(); } else driveConnect('backup'); return; }
    if (!silent) toast('Tager backup…');
    const body = await encryptSnapshot(key);
    let id = await driveFindId(); let r;
    if (id) {
      r = await gfetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/octet-stream' }, body });
      if (r.status === 404) { await setKV('driveFileId', null); id = null; }
    }
    if (!id) {
      const b = 'tid' + uid().replace(/-/g, '');
      const meta = JSON.stringify({ name: BK_NAME, mimeType: 'application/octet-stream', description: 'Krypteret backup fra Tid' });
      const mp = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/octet-stream\r\n\r\n${body}\r\n--${b}--`;
      r = await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body: mp });
      if (r.ok) await setKV('driveFileId', (await r.json()).id);
    }
    if (!r.ok) throw new Error('Drive svarede ' + r.status);
    await setKV('lastBackup', Date.now()); S.backupPending = false;
    if (!silent) toast('Backup gemt i Google Drive');
    render();
  } catch (e) {
    if (e.auth) { if (silent) { S.backupPending = true; render(); } else driveConnect('backup'); }
    else if (!silent) toast('Backup fejlede: ' + e.message);
  } finally { backupBusy = false; }
}
async function driveRestore() {
  try {
    if (!await driveToken()) return driveConnect('restore');
    const id = await driveFindId();
    if (!id) return toast('Ingen backup fundet i Google Drive');
    const r = await gfetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
    if (!r.ok) throw new Error('Drive svarede ' + r.status);
    await restoreFrom(await decryptBackup(await r.text()));
  } catch (e) { if (e.auth) driveConnect('restore'); else toast(e.message); }
}
async function autoBackup() {
  if (!(await backupKey()) || !(await getKV('driveClientId'))) return;
  const last = await getKV('lastBackup');
  if (last && Date.now() - last < 864e5) return;
  driveBackup(true);
}
async function exportFile() {
  const key = await backupKey(); if (!key) { toast('Vælg først et backup-kodeord'); return setPassphrase(); }
  const name = `Tid-backup-${today()}.tid`;
  const file = new File([await encryptSnapshot(key)], name, { type: 'application/octet-stream' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); } catch {} }
  else { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click(); }
}

/* ---------------- Events ---------------- */
document.addEventListener('click', async e => {
  const k = e.target.closest('#lock [data-k]'); if (k) return lockKey(k.dataset.k);
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'tab': S.tab = el.dataset.tab; if (S.tab === 'week') S.weekOffset = 0; window.scrollTo(0, 0); return render();
    case 'capture': return openCapture();
    case 'edit': return openCapture(S.moments.find(m => m.id === id));
    case 'close-sheet': return closeSheet();
    case 'cap-person': C.people.has(id) ? C.people.delete(id) : C.people.add(id); return renderCapture();
    case 'cap-all': { const act = activePeople(); const on = act.every(p => C.people.has(p.id)); C.people = new Set(on ? [] : act.map(p => p.id)); return renderCapture(); }
    case 'cap-cat': C.category = id; return renderCapture();
    case 'cap-pres': C.presence = Number(el.dataset.n); return renderCapture();
    case 'cap-photo': return $('#photoInput').click();
    case 'cap-photo-remove': C.photoBlob = null; C.removePhoto = true; return renderCapture();
    case 'cap-save': return saveCapture();
    case 'cap-delete': return deleteMoment(C.id);
    case 'week-prev': S.weekOffset--; return render();
    case 'week-next': if (S.weekOffset < 0) S.weekOffset++; return render();
    case 'review': return openReview(el.dataset.wk || isoWeek(today()));
    case 'rv-next': collectReview(); R.step++; return renderReview();
    case 'rv-back': collectReview(); R.step--; return renderReview();
    case 'rv-save': return saveReview();
    case 'go-backup': S.tab = 'settings'; await render(); document.querySelectorAll('h2')[3]?.scrollIntoView({ behavior: 'smooth' }); return;
    case 'drive-backup': return driveBackup(false);
    case 'drive-restore': return driveRestore();
    case 'set-pass': return setPassphrase();
    case 'save-cid': { const v = $('#cidInput').value.trim(); await setKV('driveClientId', v || null); toast(v ? 'Client ID gemt' : 'Client ID fjernet'); return render(); }
    case 'export': return exportFile();
    case 'import': return $('#importInput').click();
    case 'change-pin': return showLock('setup1');
    case 'snak-person': S.snakPerson = id; return render();
    case 'snak-depth': { const p = person(S.snakPerson); S.snakDepth[kindOf(p)] = Number(el.dataset.d); for (const x of activePeople()) if (kindOf(x) === kindOf(p)) delete S.snakCur[x.id]; return render(); }
    case 'snak-new': { const p = person(S.snakPerson); const i = pickIdea(p, 'starter', currentStarter(p)?.id); if (i) S.snakCur[p.id] = i.id; return render(); }
    case 'snak-show': S.snakCur[S.snakPerson] = el.dataset.idea; window.scrollTo(0, 0); return render();
    case 'snak-fav': { const f = S.ideas.fav, x = el.dataset.idea; S.ideas.fav = f.includes(x) ? f.filter(y => y !== x) : [...f, x]; await saveIdeas(); return render(); }
    case 'snak-used': {
      const i = ideaOf(el.dataset.idea); S.ideas.used[i.id] = Date.now(); await saveIdeas();
      return openCapture(null, { people: [S.snakPerson], category: 'snak', note: i.text, ideaId: i.id });
    }
    case 'ch-new': {
      const p = person(S.snakPerson); const wk = isoWeek(today()); const cur = S.ideas.week[wk]?.[p.id];
      const i = pickIdea(p, 'challenge', cur?.id); if (i) { S.ideas.week[wk][p.id] = { id: i.id, done: false }; await saveIdeas(); }
      return render();
    }
    case 'ch-done': {
      const p = person(S.snakPerson); const w = S.ideas.week[isoWeek(today())][p.id];
      w.done = true; S.ideas.used[w.id] = Date.now(); await saveIdeas(); await render();
      return openCapture(null, { people: [p.id], note: 'Udfordring: ' + ideaOf(w.id).text, ideaId: w.id });
    }
    case 'add-custom': {
      const p = person(S.snakPerson); const type = el.dataset.type;
      const v = await modal({ title: type === 'starter' ? 'Eget spørgsmål' : 'Egen udfordring', fields: [{ name: 't', placeholder: type === 'starter' ? 'Hvad vil du spørge om?' : 'Hvad vil du gøre?' }], ok: 'Tilføj' });
      if (v?.t.trim()) { S.ideas.custom.push({ id: 'c' + uid(), type, for: p.kind === 'partner' ? 'partner' : 'child', age: 0, text: v.t.trim() }); await saveIdeas(); render(); }
      return;
    }
    case 'del-custom': S.ideas.custom = S.ideas.custom.filter(i => i.id !== el.dataset.idea); await saveIdeas(); return render();
    case 'add-person': {
      const v = await modal({ title: 'Ny person', fields: [{ name: 'n', placeholder: 'Navn' }], ok: 'Tilføj' });
      if (v?.n.trim()) { await put('people', { id: uid(), name: v.n.trim(), kind: 'child', color: '#8bd5ca', active: true, order: S.people.length }); await loadAll(); render(); }
      return;
    }
    case 'add-cat': {
      const v = await modal({ title: 'Ny kategori', fields: [{ name: 'e', placeholder: 'Emoji, fx 🎨' }, { name: 'l', placeholder: 'Navn, fx Tegne' }], ok: 'Tilføj' });
      if (v?.l.trim()) { await put('categories', { id: uid(), emoji: v.e.trim() || '•', label: v.l.trim(), active: true, order: S.cats.length }); await loadAll(); render(); }
      return;
    }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.ch === 'cap-note' && C) C.note = t.value;
});
document.addEventListener('change', async e => {
  const t = e.target, ch = t.dataset.ch, id = t.dataset.id;
  if (!ch) return;
  if (ch === 'cap-date' && C) { C.date = t.value || today(); return; }
  if (ch.startsWith('person-')) {
    const p = { ...person(id) };
    if (ch === 'person-name') p.name = t.value.trim() || p.name;
    if (ch === 'person-color') p.color = t.value;
    if (ch === 'person-kind') p.kind = t.value;
    if (ch === 'person-active') p.active = t.checked;
    if (ch === 'person-year') { const y = Number(t.value); p.birthYear = y > 1900 && y <= new Date().getFullYear() ? y : undefined; }
    await put('people', p); await loadAll();
    if (ch === 'person-kind') render();
    return;
  }
  if (ch.startsWith('cat-')) {
    const c = { ...catOf(id) };
    if (ch === 'cat-emoji') c.emoji = t.value.trim() || c.emoji;
    if (ch === 'cat-label') c.label = t.value.trim() || c.label;
    if (ch === 'cat-active') c.active = t.checked;
    await put('categories', c); await loadAll(); return;
  }
  if (ch === 'faceid') { if (t.checked) { if (!await enableFace()) t.checked = false; } else { await setKV('faceId', null); toast('Face ID slået fra'); } }
});
$('#photoInput').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !C) return;
  try { C.photoBlob = await compress(f); C.removePhoto = false; renderCapture(); } catch { toast('Kunne ikke læse billedet'); }
});
$('#importInput').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { await restoreFrom(await decryptBackup(await f.text())); } catch (err) { toast(err.message); }
});

/* ---------------- Start ---------------- */
(async function init() {
  db = await openDB();
  await handleOAuthReturn();
  if (!(await getKV('seeded'))) await seed();
  await loadAll();
  const qp = new URLSearchParams(location.search);
  if (qp.has('capture')) S.pending.push(() => openCapture());
  if (qp.has('review')) S.pending.push(() => openReview(isoWeek(today())));
  if ([...qp.keys()].length) history.replaceState(null, '', location.pathname);
  showLock((await getKV('pin')) ? 'unlock' : 'setup1');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
